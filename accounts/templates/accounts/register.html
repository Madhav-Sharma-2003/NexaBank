{% extends 'accounts/base.html' %}
{% block title %}Register - NexaBank{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-4">
        <div class="card glow p-4">
            <div class="text-center mb-4">
                <div style="font-size:2rem;">🏦</div>
                <h4 class="fw-bold mt-2">Open Account</h4>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password1" class="form-control" placeholder="Create password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="password2" class="form-control" placeholder="Repeat password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Account Type</label>
                    <select name="account_type" class="form-select">
                        <option value="savings">💰 Savings Account</option>
                        <option value="current">🏢 Current Account</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
            </form>
            <p class="text-center mt-4" style="color:#475569; font-size:0.85rem;">
                Already have an account?
                <a href="{% url 'login' %}" style="color:#6366f1; text-decoration:none; font-weight:600;">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
